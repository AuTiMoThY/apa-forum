services:
  # Nuxt.js 前台（選用：--profile nuxt 啟動；建議本機 pnpm dev 以保留 auto-import）
  frontend:
    profiles:
      - nuxt
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: apaforum-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    ports:
      - "${FRONTEND_PORT:-8090}:8090"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8092}
      HOST: 0.0.0.0
      PORT: 8090
      CI: "true"
    # 使用 volumes: ./frontend:/app 已即時同步，無需 develop.watch sync（會與 bind mount 衝突並產生警告）
    depends_on:
      api:
        condition: service_healthy
    networks:
      - apaforum-network

  # Nuxt.js 後台管理介面（選用：--profile nuxt 啟動；建議本機 pnpm dev 以保留 auto-import）
  admin:
    profiles:
      - nuxt
    build:
      context: ./admin
      dockerfile: ../docker/admin/Dockerfile
    container_name: apaforum-admin
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_nuxt:/app/.nuxt
    ports:
      - "${ADMIN_PORT:-8091}:8091"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NUXT_WATCH_POLL: true
      NUXT_WATCH_POLL_DELAY: 200
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8092}
      HOST: 0.0.0.0
      PORT: 8091
      CI: "true"
    # 使用 volumes: ./admin:/app 已即時同步，無需 develop.watch sync（會與 bind mount 衝突並產生警告）
    depends_on:
      api:
        condition: service_healthy
    networks:
      - apaforum-network


  # PHP 後端服務（CodeIgniter 4 with Apache）
  api:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: apaforum-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      - ./api/writable:/var/www/html/writable
    ports:
      - "${API_PORT:-8092}:80"
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-apaforum}
      DB_USERNAME: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8092}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apaforum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL 資料庫服務
  mysql:
    image: mysql:8.0
    container_name: apaforum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apaforum}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/charset.cnf:ro
    networks:
      - apaforum-network
    healthcheck:
      # 使用 CMD-SHELL 讓密碼從容器內環境變數讀取，避免 compose 解析時未設定 .env 導致健康檢查失敗
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin（資料庫管理工具，開發環境可選）
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: apaforum-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8093}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-app_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      UPLOAD_LIMIT: 300M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apaforum-network

volumes:
  mysql_data:
    driver: local
  admin_node_modules:
    driver: local
  admin_nuxt:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_nuxt:
    driver: local

networks:
  apaforum-network:
    driver: bridge
